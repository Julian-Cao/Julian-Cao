<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Core expertise: AI applications, cloud architecture, data and analytics">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .card { animation: rise .9s ease-out both; }
      .c2 { animation-delay: .15s } .c3 { animation-delay: .3s }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    </style>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d36"/>
      <stop offset="1" stop-color="#0e1428"/>
    </linearGradient>
    <clipPath id="k1"><rect x="8" y="8" width="378" height="284" rx="16"/></clipPath><clipPath id="k2"><rect x="411" y="8" width="378" height="284" rx="16"/></clipPath><clipPath id="k3"><rect x="814" y="8" width="378" height="284" rx="16"/></clipPath>
  </defs>

  <!-- Card 1: AI -->
  <g class="card t">
    <rect x="8" y="8" width="378" height="284" rx="16" fill="url(#cardbg)" stroke="#8E75B2" stroke-opacity="0.5"/>
    <rect clip-path="url(#k1)" x="8" y="8" width="378" height="5" fill="#8E75B2"/>
    <g transform="translate(40 48)">
      <rect width="56" height="56" rx="14" fill="#8E75B2" fill-opacity="0.18"/>
      <path d="M28 12 L31 24 L43 28 L31 32 L28 44 L25 32 L13 28 L25 24 Z" fill="#c5b3e6"/>
    </g>
    <text x="40" y="140" fill="#ffffff" font-size="24" font-weight="700">Generative AI Apps</text>
    <text x="40" y="168" fill="#9aa6c2" font-size="15">LLM products, end to end</text>
    <g fill="#d4dbec" font-size="15">
      <text x="40" y="208">▸ Agents, RAG &amp; tool use</text>
      <text x="40" y="236">▸ Gemini · Claude · OpenAI</text>
      <text x="40" y="264">▸ Prompt &amp; eval engineering</text>
    </g>
  </g>

  <!-- Card 2: Cloud -->
  <g class="card c2 t">
    <rect x="411" y="8" width="378" height="284" rx="16" fill="url(#cardbg)" stroke="#4285F4" stroke-opacity="0.5"/>
    <rect clip-path="url(#k2)" x="411" y="8" width="378" height="5" fill="#4285F4"/>
    <g transform="translate(443 48)">
      <rect width="56" height="56" rx="14" fill="#4285F4" fill-opacity="0.18"/>
      <path d="M18 38 a8 8 0 0 1 1-16 a11 11 0 0 1 21 3 a7 7 0 0 1 -1 13 Z" fill="#a8c7ff"/>
    </g>
    <text x="443" y="140" fill="#ffffff" font-size="24" font-weight="700">Cloud Architecture</text>
    <text x="443" y="168" fill="#9aa6c2" font-size="15">Scalable, serverless, production-ready</text>
    <g fill="#d4dbec" font-size="15">
      <text x="443" y="208">▸ Google Cloud · Gemini API</text>
      <text x="443" y="236">▸ Cloud Run · Firebase · Docker</text>
      <text x="443" y="264">▸ Infrastructure as Code</text>
    </g>
  </g>

  <!-- Card 3: Data -->
  <g class="card c3 t">
    <rect x="814" y="8" width="378" height="284" rx="16" fill="url(#cardbg)" stroke="#34A853" stroke-opacity="0.5"/>
    <rect clip-path="url(#k3)" x="814" y="8" width="378" height="5" fill="#34A853"/>
    <g transform="translate(846 48)">
      <rect width="56" height="56" rx="14" fill="#34A853" fill-opacity="0.18"/>
      <rect x="14" y="30" width="7" height="14" rx="2" fill="#9be3b0"/>
      <rect x="25" y="20" width="7" height="24" rx="2" fill="#9be3b0"/>
      <rect x="36" y="12" width="7" height="32" rx="2" fill="#9be3b0"/>
    </g>
    <text x="846" y="140" fill="#ffffff" font-size="24" font-weight="700">Data &amp; Analytics</text>
    <text x="846" y="168" fill="#9aa6c2" font-size="15">Strategy and platforms at enterprise scale</text>
    <g fill="#d4dbec" font-size="15">
      <text x="846" y="208">▸ BigQuery · dbt · Looker</text>
      <text x="846" y="236">▸ Product &amp; growth analytics</text>
      <text x="846" y="264">▸ Building data teams</text>
    </g>
  </g>
</svg>
