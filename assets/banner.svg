<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Julian Cao — Google Developer Expert, AI Builder, Data Leader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.35" stop-color="#34A853"/>
      <stop offset="0.65" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#EA4335"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8E75B2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8E75B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .pulse.d1 { animation-delay: .6s } .pulse.d2 { animation-delay: 1.2s }
      .pulse.d3 { animation-delay: 1.8s } .pulse.d4 { animation-delay: 2.4s }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .flow { stroke-dasharray: 6 8; animation: flow 4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -112 } }
      .fade { animation: fade 1.2s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <circle cx="930" cy="150" r="220" fill="url(#glow)"/>
  <circle cx="1080" cy="290" r="160" fill="url(#glow2)"/>

  <!-- Neural-network illustration -->
  <g transform="translate(790 60)" stroke-width="1.5" fill="none">
    <g stroke="#7aa7ff" stroke-opacity="0.45" class="flow">
      <path d="M0 40 L120 20 M0 40 L120 110 M0 40 L120 200
               M0 130 L120 20 M0 130 L120 110 M0 130 L120 200
               M0 220 L120 20 M0 220 L120 110 M0 220 L120 200
               M120 20 L240 65 M120 20 L240 155
               M120 110 L240 65 M120 110 L240 155
               M120 200 L240 65 M120 200 L240 155
               M240 65 L330 110 M240 155 L330 110"/>
    </g>
    <g stroke="none">
      <circle cx="0" cy="40" r="9" fill="#4285F4" class="pulse"/>
      <circle cx="0" cy="130" r="9" fill="#34A853" class="pulse d1"/>
      <circle cx="0" cy="220" r="9" fill="#FBBC05" class="pulse d2"/>
      <circle cx="120" cy="20" r="11" fill="#8ab4ff" class="pulse d3"/>
      <circle cx="120" cy="110" r="11" fill="#8ab4ff" class="pulse d4"/>
      <circle cx="120" cy="200" r="11" fill="#8ab4ff" class="pulse d1"/>
      <circle cx="240" cy="65" r="12" fill="#b39ddb" class="pulse d2"/>
      <circle cx="240" cy="155" r="12" fill="#b39ddb" class="pulse d3"/>
      <circle cx="330" cy="110" r="16" fill="#EA4335" class="pulse"/>
      <circle cx="330" cy="110" r="26" fill="none" stroke="#EA4335" stroke-opacity="0.4"/>
    </g>
  </g>

  <!-- Text -->
  <g class="t fade">
    <text x="64" y="92" fill="#8ab4ff" font-size="16" font-weight="600" letter-spacing="4">HELLO, I'M</text>
    <text x="62" y="160" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-1">Julian Cao</text>
    <rect x="64" y="180" width="140" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="224" fill="#e6ebf5" font-size="22" font-weight="600">AI Application Developer · Head of Data &amp; Analytics</text>
    <text x="64" y="256" fill="#9aa6c2" font-size="17">Turning LLMs, Cloud and Data into products people actually use.</text>
  </g>

  <!-- Credential chips -->
  <g class="t" font-size="13" font-weight="700">
    <rect x="64" y="280" width="232" height="30" rx="15" fill="#4285F4" fill-opacity="0.15" stroke="#4285F4" stroke-opacity="0.6"/>
    <text x="180" y="300" fill="#a8c7ff" text-anchor="middle">GOOGLE DEVELOPER EXPERT</text>
    <rect x="308" y="280" width="290" height="30" rx="15" fill="#EA4335" fill-opacity="0.15" stroke="#EA4335" stroke-opacity="0.6"/>
    <text x="453" y="300" fill="#ffb4ab" text-anchor="middle">GOOGLE CLOUD CHAMPION INNOVATOR</text>
  </g>
</svg>
